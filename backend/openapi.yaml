openapi: 3.0.0
info:
  title: Rainbow Brain Collaboration API
  description: API specification for a Slack-alternative integrating OpenRainbow CPaaS and a structured Knowledge Base.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local Development Server

# --- SECURITY ---
security:
  - bearerAuth: []

# --- PATHS ---
paths:
  # EPIC 1: AUTHENTICATION
  /auth/register:
    post:
      summary: Register a new user
      tags: [1. Auth & Users]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created (Local + Rainbow)

  /auth/login:
    post:
      summary: Authenticate user
      tags: [1. Auth & Users]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Successful login. Returns API JWT and Rainbow SDK Token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"

  /users/me:
    get:
      summary: Get current user profile
      tags: [1. Auth & Users]
      responses:
        "200":
          description: User profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # EPIC 2 & 3: COMMUNITIES
  /communities:
    get:
      summary: List or search communities
      tags: [2. Communities]
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: List of communities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Community"
    post:
      summary: Create a new community
      tags: [2. Communities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunityInput"
      responses:
        "201":
          description: Community created

  /communities/{id}/join:
    post:
      summary: Join a community
      tags: [2. Communities]
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200":
          description: Successfully joined

  /communities/{id}/members/{userId}:
    delete:
      summary: Exclude a member (Moderator only)
      tags: [3. Roles & Moderation]
      parameters:
        - $ref: "#/components/parameters/pathId"
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Member excluded and removed from Rainbow Bubbles

  # EPIC 4: SUBGROUPS
  /communities/{id}/subgroups:
    get:
      summary: List subgroups for a community
      tags: [4. Subgroups]
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200":
          description: List of subgroups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subgroup"
    post:
      summary: Create a thematic subgroup
      tags: [4. Subgroups]
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubgroupInput"
      responses:
        "201":
          description: Subgroup created and Rainbow Bubble instantiated

  /subgroups/{subgroupId}/join:
    post:
      summary: Join a specific subgroup
      tags: [4. Subgroups]
      parameters:
        - in: path
          name: subgroupId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Added to local Subgroup and Rainbow Bubble

  # EPIC 6: KNOWLEDGE BASE
  /knowledge:
    post:
      summary: Pin a message to the Knowledge Base
      tags: [5. Knowledge Base]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeInput"
      responses:
        "201":
          description: Knowledge item saved

  /communities/{id}/knowledge:
    get:
      summary: Retrieve knowledge base items for a community
      tags: [5. Knowledge Base]
      parameters:
        - $ref: "#/components/parameters/pathId"
        - in: query
          name: tags
          schema:
            type: string
            description: Comma-separated tags for filtering
      responses:
        "200":
          description: List of knowledge items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeItem"

  # EPIC 7: EVENTS
  /communities/{id}/events:
    get:
      summary: List upcoming events
      tags: [6. Events]
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      summary: Create an event
      tags: [6. Events]
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventInput"
      responses:
        "201":
          description: Event created

  # EPIC 8 & 9: SEARCH & SUGGESTIONS
  /search:
    get:
      summary: Federated search across KB and messages
      tags: [7. Search]
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Search query string
        - in: query
          name: communityId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Mixed results from Prisma and Rainbow APIs

  /communities/{id}/themes:
    post:
      summary: Suggest a new subgroup theme
      tags: [8. Suggestions]
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suggestedName]
              properties:
                suggestedName:
                  type: string
      responses:
        "201":
          description: Suggestion submitted to moderators

# --- COMPONENTS ---
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    pathId:
      name: id
      in: path
      required: true
      description: The ID of the primary resource (e.g., Community ID)
      schema:
        type: string
        format: uuid

  schemas:
    # Entities
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        pseudo: { type: string }
        bio: { type: string }
        avatarUrl: { type: string }
        rainbowUserId: { type: string }

    Community:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    Subgroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        theme: { type: string }
        communityId: { type: string, format: uuid }
        rainbowBubbleId: { type: string }

    KnowledgeItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        subgroupId: { type: string, format: uuid }
        rainbowMessageId: { type: string }
        content: { type: string }
        tags:
          type: array
          items: { type: string }
        isPinned: { type: boolean }
        createdAt: { type: string, format: date-time }

    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        communityId: { type: string, format: uuid }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        conferenceLink: { type: string, format: uri }

    # Inputs (DTOs)
    RegisterInput:
      type: object
      required: [email, password, pseudo]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        pseudo: { type: string }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    AuthTokens:
      type: object
      properties:
        token: { type: string, description: "Backend JWT" }
        rainbowToken: { type: string, description: "OpenRainbow SDK Token" }

    CreateCommunityInput:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }

    CreateSubgroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        theme: { type: string }

    CreateKnowledgeInput:
      type: object
      required: [subgroupId, rainbowMessageId, content]
      properties:
        subgroupId: { type: string, format: uuid }
        rainbowMessageId: { type: string }
        content: { type: string }
        tags:
          type: array
          items: { type: string }

    CreateEventInput:
      type: object
      required: [title, startTime, endTime, conferenceLink]
      properties:
        title: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        conferenceLink: { type: string, format: uri }
