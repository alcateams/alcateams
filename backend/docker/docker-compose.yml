name: alcateams

services:
  postgres:
    container_name: alcateams-postgres
    image: postgres:18-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'alcateams'
    volumes:
      - alcateams-postgres:/var/lib/postgresql
    networks:
      - postgres

  pgadmin:
    container_name: alcateams-pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 5050:80
    networks:
      - postgres

networks:
  postgres:
    driver: bridge

volumes:
  alcateams-postgres: