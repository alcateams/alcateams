name: Code Quality (Oxc)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - name: Lint Backend (Oxlint)
        working-directory: ./backend
        run: npx oxlint@latest

      - name: Format Check Backend (Oxfmt)
        working-directory: ./backend
        run: npx oxfmt@latest --check .

      # - name: Lint Frontend (Oxlint)
      #   working-directory: ./frontend
      #   run: npx oxlint@latest

      # - name: Format Check Frontend (Oxfmt)
      #   working-directory: ./frontend
      #   run: npx oxfmt@latest --check .
