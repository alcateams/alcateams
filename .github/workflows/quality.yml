name: Code Quality (Oxc)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Use the locked oxlint/oxfmt versions: `@latest` drifts from what developers run.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Format Check (Oxfmt)
        run: npm run fmt:check

  frontend:
    name: Frontend Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Oxlint loads the TanStack Query ESLint plugin (`jsPlugins`) from node_modules.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Oxlint)
        run: pnpm lint

      - name: Format Check (Oxfmt)
        run: pnpm format:check
